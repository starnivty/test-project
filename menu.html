<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Our Days</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background-image: url('img/background.png');
            background-size: cover;
            background-repeat: repeat;
            background-position: center;
            cursor: url('img/kursor.png') 20 20, auto;
            font-family: "EB Garamond", serif;
        }

        .center-container {
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            max-width: 90%;
        }
        .bi-bookmark-heart {
            font-size: 18px;
        }
        @media (max-width: 768px) {
            .bi-bookmark-heart {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="center-container d-flex flex-column">
        <div class="card" style="border-radius: 25px;">
            <div class="card-body">
                <div class="card-text d-flex align-items-center text-center gap-2">
                    <p style="margin: 0; font-size: 18px; font-weight: bold;">Kita inget-inget dulu yuk apa yang sudah kita lalui selama ini?</p><span><i class="bi bi-bookmark-heart"></i></span>
                </div>
            </div>
        </div>
        <br>
        <div class="d-flex gap-2">
            <a onclick="location.href='chat.html'">
                <div class="card" style="border-radius: 25px;">
                    <div class="card-body">
                        <div class="card-text d-flex flex-column align-items-center text-center">
                            <i class="bi bi-chat" style="font-size: 3rem;"></i>
                        </div>
                    </div>
                </div>
            </a>
            <a onclick="location.href='gallery.html'">
                <div class="card" style="border-radius: 25px;">
                    <div class="card-body">
                        <div class="card-text d-flex flex-column align-items-center text-center">
                            <i class="bi bi-camera2" style="font-size: 3rem;"></i>
                        </div>
                    </div>
                </div>
            </a>
            <a onclick="location.href='game.html'">
                <div class="card" style="border-radius: 25px;">
                    <div class="card-body">
                        <div class="card-text d-flex flex-column align-items-center text-center">
                            <i class="bi bi-controller" style="font-size: 3rem;"></i>
                        </div>
                    </div>
                </div>
            </a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>
        if (sessionStorage.getItem("access_granted") !== "yes") {
            alert("Kamu belum masuk lewat halaman passcode!");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
