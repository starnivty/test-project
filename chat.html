<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Days</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background-image: url('img/background.png');
      background-size: cover;
      background-repeat: repeat;
      background-position: center;
      cursor: url('img/kursor.png') 20 20, auto;
      font-family: "EB Garamond", serif;
    }

    .center-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        padding: 1rem;
    }

    .card {
      border-radius: 25px;
      width: 100%;
      max-width: 350px;
    }

    /* Geser panah keluar dari area card */
    .carousel-control-prev,
    .carousel-control-next {
      width: 70%;
    }

    .carousel-control-prev-icon,
    .carousel-control-next-icon {
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      width: 40px;
      height: 40px;
    }

    @media (max-width: 576px) {
      .carousel-control-prev,
      .carousel-control-next {
        width: 10%;
      }
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 15px;
    }
  </style>
</head>
<body>
  <div class="center-container">
    <div id="cardCarousel" class="carousel slide carousel-fade w-100" data-bs-ride="carousel">
      <div class="carousel-inner">

        <!-- Card 1 -->
        <div class="carousel-item active" data-bs-interval="10000">
          <div class="card mx-auto shadow">
            <div class="card-body">
              <div class="card-text d-flex flex-column align-items-center text-center gap-2">
                <p class="fw-bold mb-2" style="font-size: 18px;">Pertama Kali Chat</p>
                <img src="img/chat/firstdm.jpg" alt="DM Pertama">
              </div>
            </div>
          </div>
        </div>

        <!-- Card 2 -->
        <div class="carousel-item" data-bs-interval="10000">
          <div class="card mx-auto shadow">
            <div class="card-body">
              <div class="card-text d-flex flex-column align-items-center text-center gap-2">
                <p class="fw-bold mb-2" style="font-size: 18px;">Pas Kamu Nembak Aku</p>
                <img src="img/chat/jadianpertama.png" alt="Jadian Pertama">
              </div>
            </div>
          </div>
        </div>

        <!-- Card 3 -->
        <div class="carousel-item" data-bs-interval="10000">
          <div class="card mx-auto shadow">
            <div class="card-body">
              <div class="card-text d-flex flex-column align-items-center text-center gap-2">
                <p class="fw-bold mb-2" style="font-size: 18px;">Rekaman Bareng</p>
                <img src="img/chat/rekaman.png" alt="Rekaman">
              </div>
            </div>
          </div>
        </div>

        <div class="carousel-item" data-bs-interval="10000">
          <div class="card mx-auto shadow">
            <div class="card-body">
              <div class="card-text d-flex flex-column align-items-center text-center gap-2">
                <p class="fw-bold mb-2" style="font-size: 18px;">Mensiv Pertama</p>
                <img src="img/chat/mensivpertama.png" alt="Mensiv Pertama">
              </div>
            </div>
          </div>
        </div>

        <div class="carousel-item" data-bs-interval="10000">
          <div class="card mx-auto shadow">
            <div class="card-body">
              <div class="card-text d-flex flex-column align-items-center text-center gap-2">
                <p class="fw-bold mb-2" style="font-size: 18px;">Mensiv Kedua</p>
                <img src="img/chat/mensivkedua.png" alt="Mensiv Kedua">
              </div>
            </div>
          </div>
        </div>

        <div class="carousel-item" data-bs-interval="10000">
          <div class="card mx-auto shadow">
            <div class="card-body">
              <div class="card-text d-flex flex-column align-items-center text-center gap-2">
                <p class="fw-bold mb-2" style="font-size: 18px;">Valentine 2024</p>
                <img src="img/chat/valentine2024.png" alt="Valentine 2024">
              </div>
            </div>
          </div>
        </div>

        <div class="carousel-item" data-bs-interval="10000">
          <div class="card mx-auto shadow">
            <div class="card-body">
              <div class="card-text d-flex flex-column align-items-center text-center gap-2">
                <p class="fw-bold mb-2" style="font-size: 18px;">Mensiv Ketiga</p>
                <img src="img/chat/mensivketiga.png" alt="Mensiv Ketiga">
              </div>
            </div>
          </div>
        </div>

        <div class="carousel-item" data-bs-interval="10000">
          <div class="card mx-auto shadow">
            <div class="card-body">
              <div class="card-text d-flex flex-column align-items-center text-center gap-2">
                <p class="fw-bold mb-2" style="font-size: 18px;">100 Hari Bersama</p>
                <img src="img/chat/100harian.png" alt="100 Hari Bersama">
              </div>
            </div>
          </div>
        </div>

        <div class="carousel-item" data-bs-interval="10000">
          <div class="card mx-auto shadow">
            <div class="card-body">
              <div class="card-text d-flex flex-column align-items-center text-center gap-2">
                <p class="fw-bold mb-2" style="font-size: 18px;">Mensiv Keempat</p>
                <img src="img/chat/mensivkeempat.jpg" alt="Mensiv Keempat">
              </div>
            </div>
          </div>
        </div>

        <div class="carousel-item" data-bs-interval="10000">
          <div class="card mx-auto shadow">
            <div class="card-body">
              <div class="card-text d-flex flex-column align-items-center text-center gap-2">
                <p class="fw-bold mb-2" style="font-size: 18px;">Mensiv Kelima</p>
                <img src="img/chat/mensivkelima.png" alt="Mensiv Kelima">
              </div>
            </div>
          </div>
        </div>

        <div class="carousel-item" data-bs-interval="10000">
          <div class="card mx-auto shadow">
            <div class="card-body">
              <div class="card-text d-flex flex-column align-items-center text-center gap-2">
                <p class="fw-bold mb-2" style="font-size: 18px;">Mensiv Keenam</p>
                <img src="img/chat/mensivkeenam.png" alt="Mensiv Keenam">
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Tombol panah kiri -->
      <button class="carousel-control-prev" type="button" data-bs-target="#cardCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>

      <!-- Tombol panah kanan -->
      <button class="carousel-control-next" type="button" data-bs-target="#cardCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
    <div class="text-center mt-2">
      <a href="menu.html" class="btn btn-outline-light btn-lg px-4" style="border-radius: 15px; background-color: rgba(0, 0, 0, 0.8);">
        <i class="bi bi-arrow-left-circle me-2"></i>Kembali ke Menu
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
