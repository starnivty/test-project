<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Our Days</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet" />

  <style>
    html, body {
        min-height: 100vh;
        margin: 0;
        font-family: "EB Garamond", serif;
        background-image: url('img/background.png');
        background-size: cover;
        background-repeat: repeat;
        background-position: center;
        cursor: url('img/kursor.png') 20 20, auto;
    }

    .container-wrapper {
        padding: 2rem 1rem;
        max-width: 1000px;
        margin: 0 auto;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      border-radius: 20px;
    }

    .bi-hearts {
      font-size: 30px;
    }

    .card-title-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .masonry {
      column-count: 6;
      column-gap: 1rem; 
      padding: 20px;
    }

    .masonry img {
      width: 100%;
      display: block;
      margin: 0 auto 1rem;
      border-radius: 10px;
      break-inside: avoid;
    }

    .text-center {
        margin-bottom: 10px;
    }

    @media (max-width: 768px) {
      .masonry {
        column-count: 2;
      }
    }

    @media (max-width: 576px) {
      .masonry {
        column-count: 1;
      }
    }

    .btn-custom {
      border-radius: 15px;
      background-color: rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <div class="container-wrapper">

    <!-- Judul Card -->
    <div class="card text-center w-auto d-inline-block px-3 py-2">
      <div class="card-title-area">
        <p class="mb-0" style="font-size: 30px; font-weight: bold;">Foto-Foto Kita</p>
        <i class="bi bi-hearts"></i>
      </div>
    </div>

    <!-- Tombol Kembali -->
    <div class="text-center">
      <a href="menu.html" class="btn btn-outline-light btn-lg px-4 btn-custom">
        <i class="bi bi-arrow-left-circle me-2"></i>Kembali ke Menu
      </a>
    </div>

    <!-- Galeri Masonry -->
    <div class="card">
      <div class="masonry">
        <img src="img/gallery/1.jpg" alt="Foto 1" />
        <img src="img/gallery/2.png" alt="Foto 2" />
        <img src="img/gallery/3.png" alt="Foto 3" />
        <img src="img/gallery/4.jpg" alt="Foto 4" />
        <img src="img/gallery/5.jpg" alt="Foto 5" />
        <img src="img/gallery/6.jpg" alt="Foto 6" />
        <img src="img/gallery/7.jpg" alt="Foto 7" />
        <img src="img/gallery/8.png" alt="Foto 8" />
        <img src="img/gallery/9.png" alt="Foto 9" />
        <img src="img/gallery/10.jpg" alt="Foto 10" />
      </div>
    </div>
  </div>
  <script>
    if (sessionStorage.getItem("access_granted") !== "yes") {
        alert("Kamu belum masuk lewat halaman passcode!");
        window.location.href = "index.html";
    }
  </script>
</body>
</html>
