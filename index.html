<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Dearest Arjunat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body{
      background-image: url('background.png');
      background-size: cover;       /* Biar gambar nutup semua */
      background-repeat: no-repeat; /* Jangan ulang */
      background-position: center;  /* Tengahin gambar */
    }
    .center-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }
    .display {
      font-size: 24px;
      letter-spacing: 10px;
      margin-bottom: 20px;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      gap: 10px;
      justify-content: center;
    }
    .keypad button {
      font-size: 20px;
      padding: 20px;
      border: none;
      border-radius: 10px;
      background-color: #ffffff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.1s ease, background-color 0.2s ease;
      cursor: pointer;
    }

    .keypad button:active {
      transform: scale(0.95);
      background-color: #dcdcdc;
    }
    .actions {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="center-container">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Our Diary</h5>
        <div class="card-text">
          <div class="display" id="display">••••</div>
          <div class="keypad">
            <button onclick="addDigit('1')">1</button>
            <button onclick="addDigit('2')">2</button>
            <button onclick="addDigit('3')">3</button>
            <button onclick="addDigit('4')">4</button>
            <button onclick="addDigit('5')">5</button>
            <button onclick="addDigit('6')">6</button>
            <button onclick="addDigit('7')">7</button>
            <button onclick="addDigit('8')">8</button>
            <button onclick="addDigit('9')">9</button>
            <button onclick="clearCode()">←</button>
            <button onclick="addDigit('0')">0</button>
            <button onclick="submitCode()">✔</button>
          </div>
          <div class="actions">
            <p id="message"></p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  <script>
    let inputCode = "";
    const correctCode = "2111"; // Ganti sesuai kebutuhan

    function updateDisplay() {
      const display = document.getElementById("display");
      display.textContent = inputCode.padEnd(4, "•");
    }

    function addDigit(digit) {
      if (inputCode.length < 4) {
        inputCode += digit;
        updateDisplay();
      }
    }

    function clearCode() {
      inputCode = inputCode.slice(0, -1);
      updateDisplay();
    }

    function submitCode() {
      const message = document.getElementById("message");
      if (inputCode === correctCode) {
        message.textContent = "✅ Passcode benar, redirect...";
        message.style.color = "green";
        sessionStorage.setItem("access_granted", "yes");
        setTimeout(() => {
          window.location.href = "home.html"; // Ganti ke halaman tujuan
        }, 1000); // Delay 1 detik sebelum redirect
      } else {
        message.textContent = "❌ Passcode salah!";
        message.style.color = "red";
      }
      inputCode = "";
      updateDisplay();
    }

    updateDisplay();
  </script>
</body>
</html>
